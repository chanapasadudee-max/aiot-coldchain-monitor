site_name: AIoT for Industry — ระบบเฝ้าระวังตู้แช่ยา & ห้อง Server
site_description: คู่มือและบทเรียนการพัฒนา AIoT ระดับอุตสาหกรรมด้วยบอร์ด Cucumber RIS + Local Ollama AI Copilot + Guardrails + Telegram Mini App
site_author: Chanapa Sadudee (6610680214)
repo_name: aiot-coldchain-monitor
repo_url: https://github.com/

theme:
  name: material
  language: th
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: สลับเป็นธีมสว่าง
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/brightness-7
        name: สลับเป็นธีมมืด
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - หน้าแรก: index.md
  - 🧪 Live Sandbox: live_sandbox.md
  - สำหรับผู้เรียน (Learner):
      - 1. สถาปัตยกรรมระบบ AIoT: 01_system_architecture.md
      - 2. บอร์ด Cucumber RIS & Multi-Sensor: 02_cucumber_hardware.md
      - 3. การสื่อสาร MQTT สองทาง: 03_mqtt_cloud_broker.md
      - 4. AI Anomaly & Google Colab: 04_ai_anomaly_detection.md
      - 5. UI, AI Copilot & Telegram Mini App: 05_telegram_mini_app.md
  - สำหรับผู้สอน / วิศวกร (Instructor):
      - 6. การติดตั้ง Docker & Dev Tunnels: 06_docker_deployment.md
      - 7. โมเดลธุรกิจ & ความคุ้มค่า (ROI): 07_business_case.md
      - 8. ความปลอดภัย AI & Guardrails: 09_ai_safety_guardrails.md
      - 9. สคริปต์คลิปนำเสนอ AI Flow: 08_video_walkthrough.md
